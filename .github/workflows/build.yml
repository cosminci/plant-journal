name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache:
        description: Restore and save the build cache
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  guidance:
    name: Check shared guidance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          git clone --quiet --depth 1 https://github.com/cosminci/agentic-workflows.git "$RUNNER_TEMP/agentic-workflows"
          git config --global agentic.workflowsPath "$RUNNER_TEMP/agentic-workflows"
          bash scripts/workflows check
  build:
    name: Verify changed components
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DAGGER_PROGRESS: plain
      CACHE_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Dagger
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.9 sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Select cache generation
        if: env.CACHE_ENABLED == 'true'
        id: cache-generation
        env:
          FINGERPRINT: ${{ hashFiles('dagger.lock', 'dagger.json', '.dagger/src/buildEnv.ts', '.dagger/src/hooks/cache.ts', 'backend/build.sbt', 'backend/.jvmopts', 'backend/.sbtopts', 'backend/project/**/*.sbt', 'backend/project/**/*.scala', 'backend/project/**/*.properties', 'frontend/package-lock.json', 'contract/package-lock.json') }}
        run: |
          echo "ACTIONS_BUILD_CACHE=$RUNNER_TEMP/plant-build-cache" >> "$GITHUB_ENV"
          echo "prefix=plant-build-v1-$RUNNER_OS-$RUNNER_ARCH-$(date -u +%Y-%m)-$FINGERPRINT-" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        if: env.CACHE_ENABLED == 'true'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ACTIONS_BUILD_CACHE }}
          key: ${{ steps.cache-generation.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cache-generation.outputs.prefix }}

      - name: Verify changed components
        id: verify
        shell: bash scripts/with_dagger_engine bash --noprofile --norc -euo pipefail {0}
        run: |
          npm ci --prefix .dagger --no-audit --no-fund
          dagger develop
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            npm --prefix .dagger run verify
            args=(--all)
          else
            base="origin/$GITHUB_BASE_REF"
            args=(--base="$base")
            components=$(dagger call changed --base="$base")
            if [[ ",$components," == *,pipeline,* ]]; then
              npm --prefix .dagger run verify
            fi
          fi
          if [[ -n "${ACTIONS_BUILD_CACHE:-}" ]]; then
            mkdir -p "$ACTIONS_BUILD_CACHE"
            dagger call verify-cached --state="$ACTIONS_BUILD_CACHE" "${args[@]}" \
              export --path="$ACTIONS_BUILD_CACHE" --wipe=true
            read -r bytes _ < <(du -sb "$ACTIONS_BUILD_CACHE")
            if [[ "$bytes" -le 1500000000 ]]; then
              echo "cache-save=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Build cache is $bytes bytes; skipping save above the 1.5 GB snapshot budget."
            fi
          else
            dagger call verify "${args[@]}"
          fi

      - name: Save build cache
        if: steps.verify.outputs.cache-save == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ACTIONS_BUILD_CACHE }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
