name: publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Publish must be dispatched from main" >&2
            exit 1
          fi

      - name: Select cache generation
        id: cache-generation
        env:
          FINGERPRINT: ${{ hashFiles('dagger.lock', 'dagger.json', '.dagger/src/buildEnv.ts', '.dagger/src/hooks/cache.ts', 'backend/build.sbt', 'backend/.jvmopts', 'backend/.sbtopts', 'backend/project/**/*.sbt', 'backend/project/**/*.scala', 'backend/project/**/*.properties', 'frontend/package-lock.json', 'contract/package-lock.json') }}
        run: |
          mkdir -p "$RUNNER_TEMP/plant-build-cache"
          echo "prefix=plant-build-v1-$RUNNER_OS-$RUNNER_ARCH-$(date -u +%Y-%m)-$FINGERPRINT-" >> "$GITHUB_OUTPUT"

      - name: Restore trusted build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/plant-build-cache
          key: ${{ steps.cache-generation.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cache-generation.outputs.prefix }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Dagger
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.9 sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify and publish
        shell: bash scripts/with_dagger_engine bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          npm ci --prefix .dagger --no-audit --no-fund
          dagger develop
          npm --prefix .dagger run verify
          dagger call verify-cached --state="$RUNNER_TEMP/plant-build-cache" --all
          tag=$(dagger call release-version)
          registry_token=$(curl -fsS -u "$GITHUB_ACTOR:$GITHUB_TOKEN" -G \
            --data-urlencode 'scope=repository:cosminci/plant-journal:pull' \
            --data-urlencode 'service=ghcr.io' https://ghcr.io/token | jq -er '.token | select(length > 0)')
          status=$(curl -sS -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer $registry_token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/cosminci/plant-journal/manifests/$tag")
          case "$status" in
            404) ;;
            200) echo "Version $tag is already published" >&2; exit 1 ;;
            *) echo "GHCR lookup failed: HTTP $status" >&2; exit 1 ;;
          esac
          dagger call publish --tag="$tag" --token=env:GITHUB_TOKEN --registry-user="$GITHUB_ACTOR"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "v$tag" -m "Plant journal $tag"
          credential=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $credential" \
            git push origin "refs/tags/v$tag"
